name: Update Original Signal Feed

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC.
    # KST approx: 07:00, 13:00, 19:00
    - cron: "0 22,4,10 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect original signal feed
        run: python scripts/collect.py

      - name: Commit updated latest.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/data/latest.json
          git commit -m "Update original signal feed" || echo "No changes to commit"
          git push
